name: Release

# Triggered by a vX.Y.Z.W tag: builds, publishes the GitHub release, updates manifest.json on main.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag must match the project versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          meta=$(python3 -c 'import json;print(json.load(open("meta.json"))["version"])')
          csproj=$(sed -n 's:.*<AssemblyVersion>\(.*\)</AssemblyVersion>.*:\1:p' Jellyfin.Plugin.BetaSeries/Jellyfin.Plugin.BetaSeries.csproj)
          [ "$tag" = "$meta" ] && [ "$tag" = "$csproj" ] || { echo "::error::tag ${GITHUB_REF_NAME} must match meta.json ($meta) and the csproj ($csproj)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::the tag must point to a commit on main"; exit 1; }
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build and package
        run: |
          dotnet build Jellyfin.Plugin.BetaSeries -c Release -warnaserror -o build-out
          scripts/package.sh build-out
      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${prev:+$prev..}${GITHUB_REF_NAME}
          git log "$range" --no-merges --pretty='- %s' > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "- Initial release" > "$RUNNER_TEMP/notes.md"
          cp dist/*.zip meta.json "$RUNNER_TEMP/"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/*.zip --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Update manifest.json on main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          META_PATH="$RUNNER_TEMP/meta.json" scripts/update-manifest.py "$GITHUB_REPOSITORY" "$RUNNER_TEMP"/*.zip "$(tr '\n' ' ' < "$RUNNER_TEMP/notes.md" | sed 's/ *$//')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore(release): manifest ${GITHUB_REF_NAME}"
          git push origin HEAD:main
