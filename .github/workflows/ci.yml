name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Lint JavaScript (including scripts inside the HTML pages)
        run: |
          npm ci --ignore-scripts
          npm run lint
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.6"
          args: check
      - name: Check Python formatting
        run: ruff format --diff
      - name: Lint shell scripts
        run: shellcheck build.sh release.sh scripts/*.sh
      - name: Lint workflows
        run: docker run --rm -v "$PWD":/repo:ro -w /repo rhysd/actionlint:1.7.12 -color

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Check version consistency
        run: |
          meta=$(python3 -c 'import json;print(json.load(open("meta.json"))["version"])')
          csproj=$(sed -n 's:.*<AssemblyVersion>\(.*\)</AssemblyVersion>.*:\1:p' Jellyfin.Plugin.BetaSeries/Jellyfin.Plugin.BetaSeries.csproj)
          [ "$meta" = "$csproj" ] || { echo "::error::meta.json ($meta) and AssemblyVersion ($csproj) differ"; exit 1; }
          [[ "$meta" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must have 4 parts (X.Y.Z.W, Jellyfin format), found $meta"; exit 1; }
      - name: Check C# formatting
        run: dotnet format Jellyfin.Plugin.BetaSeries --verify-no-changes
      - name: Check translations
        run: |
          python3 - <<'PY'
          import glob, json, os, sys
          d = "Jellyfin.Plugin.BetaSeries/Configuration/i18n"
          base = set(json.load(open(f"{d}/en.json", encoding="utf-8")))
          bad = False
          for f in sorted(glob.glob(f"{d}/*.json")):
              keys = set(json.load(open(f, encoding="utf-8")))
              if keys != base:
                  bad = True
                  print(f"::error file={f}::missing={sorted(base - keys)} extra={sorted(keys - base)}")
          sys.exit(1 if bad else 0)
          PY
      - name: Build (warnings as errors)
        run: dotnet build Jellyfin.Plugin.BetaSeries -c Release -warnaserror -o build-out
      - name: Check test code formatting
        run: dotnet format Jellyfin.Plugin.BetaSeries.Tests --verify-no-changes
      - name: Test
        run: dotnet test --project Jellyfin.Plugin.BetaSeries.Tests -c Release
      - name: Package
        run: scripts/package.sh build-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BetaSeries-plugin
          path: dist/*.zip
          if-no-files-found: error
