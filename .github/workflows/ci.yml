name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Check version consistency
        run: |
          meta=$(python3 -c 'import json;print(json.load(open("meta.json"))["version"])')
          csproj=$(sed -n 's:.*<AssemblyVersion>\(.*\)</AssemblyVersion>.*:\1:p' Jellyfin.Plugin.BetaSeries/Jellyfin.Plugin.BetaSeries.csproj)
          [ "$meta" = "$csproj" ] || { echo "::error::meta.json ($meta) and AssemblyVersion ($csproj) differ"; exit 1; }
          [[ "$meta" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must have 4 parts (X.Y.Z.W, Jellyfin format), found $meta"; exit 1; }
      - name: Check JavaScript syntax
        run: |
          mkdir -p "$RUNNER_TEMP/js"
          python3 - "$RUNNER_TEMP/js" <<'PY'
          import glob, os, re, sys
          out = sys.argv[1]
          for f in glob.glob("Jellyfin.Plugin.BetaSeries/Configuration/*.html"):
              for i, m in enumerate(re.finditer(r"<script[^>]*>(.*?)</script>", open(f, encoding="utf-8").read(), re.S)):
                  open(os.path.join(out, f"{os.path.basename(f)}.{i}.js"), "w", encoding="utf-8").write(m.group(1))
          PY
          for f in "$RUNNER_TEMP"/js/*.js Jellyfin.Plugin.BetaSeries/Configuration/*.js; do
            echo "node --check $f"; node --check "$f"
          done
      - name: Check translations
        run: |
          python3 - <<'PY'
          import glob, json, os, sys
          d = "Jellyfin.Plugin.BetaSeries/Configuration/i18n"
          base = set(json.load(open(f"{d}/en.json", encoding="utf-8")))
          bad = False
          for f in sorted(glob.glob(f"{d}/*.json")):
              keys = set(json.load(open(f, encoding="utf-8")))
              if keys != base:
                  bad = True
                  print(f"::error file={f}::missing={sorted(base - keys)} extra={sorted(keys - base)}")
          sys.exit(1 if bad else 0)
          PY
      - name: Build (warnings as errors)
        run: dotnet build Jellyfin.Plugin.BetaSeries -c Release -warnaserror -o build-out
      - name: Package
        run: scripts/package.sh build-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BetaSeries-plugin
          path: dist/*.zip
          if-no-files-found: error
