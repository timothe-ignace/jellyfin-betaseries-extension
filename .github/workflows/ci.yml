name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Vérifier la cohérence des versions
        run: |
          meta=$(python3 -c 'import json;print(json.load(open("meta.json"))["version"])')
          csproj=$(sed -n 's:.*<AssemblyVersion>\(.*\)</AssemblyVersion>.*:\1:p' Jellyfin.Plugin.BetaSeries/Jellyfin.Plugin.BetaSeries.csproj)
          [ "$meta" = "$csproj" ] || { echo "::error::meta.json ($meta) et AssemblyVersion ($csproj) diffèrent"; exit 1; }
          [[ "$meta" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::la version doit avoir 4 chiffres (X.Y.Z.W, format Jellyfin), trouvé $meta"; exit 1; }
      - name: Compiler (warnings = erreurs)
        run: dotnet build Jellyfin.Plugin.BetaSeries -c Release -warnaserror -o build-out
      - name: Empaqueter
        run: scripts/package.sh build-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BetaSeries-plugin
          path: dist/*.zip
          if-no-files-found: error
