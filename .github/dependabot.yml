version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: nuget
    directory: /Jellyfin.Plugin.BetaSeries
    schedule: { interval: monthly }
    # Jellyfin.Controller must stay aligned with the targeted Jellyfin version: update it manually.
    ignore:
      - dependency-name: Jellyfin.Controller
