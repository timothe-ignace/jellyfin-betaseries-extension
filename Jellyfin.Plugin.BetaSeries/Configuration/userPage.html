<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>BetaSeries</title></head>
<body>
<div id="BetaSeriesUserPage" data-role="page" class="page type-interior" data-require="emby-input,emby-button">
  <div data-role="content">
    <div class="content-primary">
      <h2>BetaSeries</h2>
      <p id="bsStatus">Loading…</p>
      <p id="bsError" style="color:#e55"></p>

      <div id="bsLinked" style="display:none">
        <button is="emby-button" type="button" id="bsUnlink" class="raised emby-button"><span>Unlink my account</span></button>
      </div>

      <div id="bsUnlinked" style="display:none">
        <h3>Sign in with my account</h3>
        <form id="bsLoginForm">
          <div class="inputContainer"><input is="emby-input" type="text" id="bsLogin" label="BetaSeries login" required /></div>
          <div class="inputContainer"><input is="emby-input" type="password" id="bsPassword" label="Password" required /></div>
          <div class="fieldDescription">The password is only used to obtain a token and is never stored.</div>
          <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span>Sign in</span></button>
        </form>
        <h3>Or paste a token</h3>
        <form id="bsTokenForm">
          <div class="inputContainer"><input is="emby-input" type="text" id="bsToken" label="BetaSeries token" required /></div>
          <button is="emby-button" type="submit" class="raised block emby-button"><span>Save token</span></button>
        </form>
      </div>
    </div>
  </div>
  <script type="text/javascript">
    (function () {
      var page = document.querySelector('#BetaSeriesUserPage');
      function q(s) { return page.querySelector(s); }
      function call(method, path, body) {
        return ApiClient.ajax({
          type: method,
          url: ApiClient.getUrl('BetaSeries/' + path),
          data: body ? JSON.stringify(body) : undefined,
          contentType: 'application/json',
          dataType: 'json'
        });
      }
      function showError(err) {
        var msg = 'Error.';
        if (err && err.json) { err.json().then(function (j) { q('#bsError').textContent = j.Error || msg; }).catch(function () { q('#bsError').textContent = msg; }); }
        else { q('#bsError').textContent = msg; }
        Dashboard.hideLoadingMsg();
      }
      function refresh() {
        q('#bsError').textContent = '';
        call('GET', 'Status').then(function (s) {
          q('#bsLinked').style.display = s.Linked ? '' : 'none';
          q('#bsUnlinked').style.display = s.Linked ? 'none' : '';
          if (!s.ServerConfigured) { q('#bsStatus').textContent = "The plugin has not been configured by the administrator yet."; }
          else if (s.Linked && s.Valid) { q('#bsStatus').textContent = 'Linked to BetaSeries account: ' + s.Login; }
          else if (s.Linked) { q('#bsStatus').textContent = 'Saved token is invalid or expired: please sign in again.'; q('#bsUnlinked').style.display = ''; }
          else { q('#bsStatus').textContent = "No account linked: your playback is not being synced."; }
          Dashboard.hideLoadingMsg();
        }, showError);
      }
      page.addEventListener('pageshow', function () { Dashboard.showLoadingMsg(); refresh(); });
      q('#bsLoginForm').addEventListener('submit', function (e) {
        e.preventDefault(); Dashboard.showLoadingMsg();
        call('POST', 'Login', { Login: q('#bsLogin').value, Password: q('#bsPassword').value })
          .then(function () { q('#bsPassword').value = ''; refresh(); }, showError);
      });
      q('#bsTokenForm').addEventListener('submit', function (e) {
        e.preventDefault(); Dashboard.showLoadingMsg();
        call('POST', 'Token', { Token: q('#bsToken').value })
          .then(function () { q('#bsToken').value = ''; refresh(); }, showError);
      });
      q('#bsUnlink').addEventListener('click', function () {
        Dashboard.showLoadingMsg();
        call('DELETE', 'Token').then(refresh, showError);
      });
    })();
  </script>
</div>
</body>
</html>
