<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>BetaSeries</title></head>
<body>
<div id="BetaSeriesUserPage" data-role="page" class="page type-interior" data-require="emby-input,emby-button">
  <div data-role="content">
    <div class="content-primary">
      <h2>BetaSeries</h2>
      <p id="bsStatus" data-i18n="user.loading">Loading…</p>
      <p id="bsError" style="color:#e55"></p>

      <div id="bsLinked" style="display:none">
        <button is="emby-button" type="button" id="bsUnlink" class="raised emby-button"><span data-i18n="user.unlink">Unlink my account</span></button>
      </div>

      <div id="bsUnlinked" style="display:none">
        <h3 data-i18n="user.signInTitle">Sign in with my account</h3>
        <form id="bsLoginForm">
          <div class="inputContainer"><input is="emby-input" type="text" id="bsLogin" label="BetaSeries login" data-i18n-label="user.login" required /></div>
          <div class="inputContainer"><input is="emby-input" type="password" id="bsPassword" label="Password" data-i18n-label="user.password" required /></div>
          <div class="fieldDescription" data-i18n="user.passwordHelp">The password is only used to obtain a token and is never stored.</div>
          <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span data-i18n="user.signIn">Sign in</span></button>
        </form>
        <h3 data-i18n="user.tokenTitle">Or paste a token</h3>
        <form id="bsTokenForm">
          <div class="inputContainer"><input is="emby-input" type="text" id="bsToken" label="BetaSeries token" data-i18n-label="user.token" required /></div>
          <button is="emby-button" type="submit" class="raised block emby-button"><span data-i18n="user.saveToken">Save token</span></button>
        </form>
      </div>
    </div>
  </div>
  <script type="text/javascript">
    (function () {
      var page = document.querySelector('#BetaSeriesUserPage');
      var dict = {};
      function q(s) { return page.querySelector(s); }

      function t(key, vars) {
        var s = dict[key] || key;
        if (vars) { Object.keys(vars).forEach(function (k) { s = s.replace('{' + k + '}', function () { return vars[k]; }); // function: no special $ handling }); }
        return s;
      }
      function applyI18n() {
        page.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
        page.querySelectorAll('[data-i18n-label]').forEach(function (el) {
          var text = t(el.getAttribute('data-i18n-label'));
          el.setAttribute('label', text);
          var lbl = el.parentNode && el.parentNode.querySelector('label');
          if (lbl) { lbl.textContent = text; }
        });
      }
      // Jellyfin keeps the UI language of the current user in <html lang>.
      function loadI18n() {
        var lang = document.documentElement.getAttribute('lang') || navigator.language || 'en';
        return call('GET', 'Locale/' + encodeURIComponent(lang))
          .then(function (d) { dict = d || {}; applyI18n(); }, function () { dict = {}; });
      }

      function call(method, path, body) {
        return ApiClient.ajax({
          type: method,
          url: ApiClient.getUrl('BetaSeries/' + path),
          data: body ? JSON.stringify(body) : undefined,
          contentType: 'application/json',
          dataType: 'json'
        });
      }
      // The server answers { Code, Error }: show the translated message for known codes, else the server's text.
      function showError(err) {
        function show(j) {
          var msg = (j && j.Code && dict['error.' + j.Code]) || (j && j.Error) || t('error.generic');
          q('#bsError').textContent = msg;
          Dashboard.hideLoadingMsg();
        }
        if (err && err.json) { err.json().then(show).catch(function () { show(null); }); } else { show(null); }
      }
      function refresh() {
        q('#bsError').textContent = '';
        call('GET', 'Status').then(function (s) {
          q('#bsLinked').style.display = s.Linked ? '' : 'none';
          q('#bsUnlinked').style.display = s.Linked ? 'none' : '';
          if (!s.ServerConfigured) { q('#bsStatus').textContent = t('user.notConfigured'); }
          else if (s.Linked && s.Valid) { q('#bsStatus').textContent = t('user.linked', { login: s.Login }); }
          else if (s.Linked) { q('#bsStatus').textContent = t('user.invalid'); q('#bsUnlinked').style.display = ''; }
          else { q('#bsStatus').textContent = t('user.unlinked'); }
          Dashboard.hideLoadingMsg();
        }, showError);
      }
      page.addEventListener('pageshow', function () {
        Dashboard.showLoadingMsg();
        loadI18n().then(refresh);
      });
      q('#bsLoginForm').addEventListener('submit', function (e) {
        e.preventDefault(); Dashboard.showLoadingMsg();
        call('POST', 'Login', { Login: q('#bsLogin').value, Password: q('#bsPassword').value })
          .then(function () { q('#bsPassword').value = ''; refresh(); }, showError);
      });
      q('#bsTokenForm').addEventListener('submit', function (e) {
        e.preventDefault(); Dashboard.showLoadingMsg();
        call('POST', 'Token', { Token: q('#bsToken').value })
          .then(function () { q('#bsToken').value = ''; refresh(); }, showError);
      });
      q('#bsUnlink').addEventListener('click', function () {
        Dashboard.showLoadingMsg();
        call('DELETE', 'Token').then(refresh, showError);
      });
    })();
  </script>
</div>
</body>
</html>
