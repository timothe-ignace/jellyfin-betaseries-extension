<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>BetaSeries</title></head>
<body>
<div id="BetaSeriesConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
  <div data-role="content">
    <div class="content-primary">
      <form id="BetaSeriesConfigForm">
        <h2>BetaSeries</h2>
        <div class="inputContainer">
          <input is="emby-input" type="text" id="ApiKey" label="BetaSeries API key" />
          <div class="fieldDescription">Create one at https://www.betaseries.com/api/ ("Client ID" field). Shared by all users.</div>
        </div>
        <div class="checkboxContainer checkboxContainer-withDescription">
          <label class="emby-checkbox-label">
            <input is="emby-checkbox" type="checkbox" id="SyncMovies" />
            <span>Also sync movies</span>
          </label>
        </div>
        <p>Each user links their own account from the "BetaSeries" entry in their preferences.</p>
        <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span>Save</span></button>
      </form>
    </div>
  </div>
  <script type="text/javascript">
    (function () {
      var pluginId = 'b7d3a1f2-5c64-4e8a-9a1d-3f0b6c2e7a91';
      var page = document.querySelector('#BetaSeriesConfigPage');
      page.addEventListener('pageshow', function () {
        Dashboard.showLoadingMsg();
        ApiClient.getPluginConfiguration(pluginId).then(function (c) {
          page.querySelector('#ApiKey').value = c.ApiKey || '';
          page.querySelector('#SyncMovies').checked = c.SyncMovies !== false;
          Dashboard.hideLoadingMsg();
        });
      });
      page.querySelector('#BetaSeriesConfigForm').addEventListener('submit', function (e) {
        e.preventDefault();
        Dashboard.showLoadingMsg();
        ApiClient.getPluginConfiguration(pluginId).then(function (c) {
          c.ApiKey = page.querySelector('#ApiKey').value.trim();
          c.SyncMovies = page.querySelector('#SyncMovies').checked;
          ApiClient.updatePluginConfiguration(pluginId, c).then(Dashboard.processPluginConfigurationUpdateResult);
        });
        return false;
      });
    })();
  </script>
</div>
</body>
</html>
